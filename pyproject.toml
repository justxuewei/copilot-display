[project]
name = "copilot-display"
dynamic = ["version"]
description = "FastAPI server to push text to BluTag 4.2-inch e-ink displays over BLE"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "bleak>=0.22,<1.0",
    "pillow>=10.0.0",
    "pydantic-settings>=2.2.0",
    "yfinance>=1.2.1",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
]

[project.scripts]
copilot-display = "copilot_display.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
copilot_display = ["fonts/*.ttf"]

